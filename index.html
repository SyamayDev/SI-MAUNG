    <script>
      // Apply the colour theme before the first paint (no flash): the saved choice, else the device theme.
      (function () {
        var theme = "light";
        try {
          var pref = localStorage.getItem("simaung:theme");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          theme = dark ? "dark" : "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0d1436" : "#f9efdd");
      })();
    </script>
